name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [lts/*]

    steps:
      - name: Checkout
        uses: actions/checkout@master

      - name: Setup node env
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      # 注意：不要在这里跑 `yarn chain` + `yarn deploy`。
      # 默认网络 localhost 指向 127.0.0.1:8888（本地 Geth），与 `yarn chain`
      # 启动的 8545 端口 hardhat 节点不互通，CI 上必然连接失败。
      # lint 与类型检查只需要编译产物和已入库的 deployedContracts.ts。
      - name: Compile contracts (生成 artifacts 与 typechain 类型)
        run: yarn compile

      - name: Run hardhat tests
        run: yarn test

      - name: Run hardhat lint
        run: yarn hardhat:lint --max-warnings=0

      - name: Run nextjs lint
        run: yarn next:lint --max-warnings=0

      - name: Check typings on nextjs
        run: yarn next:check-types
